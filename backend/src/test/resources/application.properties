spring.application.name=backend
# Use localhost when running backend locally, orientdb when running in Docker
orientdb.url=remote:localhost:2424/test-sim
orientdb.username=root
orientdb.password=rootpwd
orientdb.db.name=test-sim
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Logging configuration
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.flunav=DEBUG
logging.level.com.orientechnologies=WARN

# Configure pattern for logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Enable request logging
spring.mvc.log-request-details=true

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# RabbitMQ Custom Properties
rabbitmq.queue.item-events=item-events-queue
rabbitmq.exchange.item-events=item-events-exchange
rabbitmq.routing-key.item-events=1

# ClickHouse Configuration
clickhouse.url=http://localhost:8124/default
clickhouse.username=default
clickhouse.password=Oncode01

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=9a4f2c8d3b7a1e6f9g8h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d2e3f4g5h6i7j8k9l0m1n2o3p4
jwt.expiration=86400000
jwt.refreshExpirationMs=604800000

#Auth
superadmin.username=admin
superadmin.password=Flun4v!

# Demo Mode
app.demo-mode=false

springwolf.docket.base-package=com.flunav.backend

springwolf.docket.info.title=Flunav Real-time API (Test)
springwolf.docket.info.version=1.0.0

springwolf.docket.servers.stomp.protocol=ws
springwolf.docket.servers.stomp.host=localhost:8080
springwolf.docket.servers.stomp.description=Flunav WebSocket Server
springwolf.scanner.stomp.consumer.enabled=false
