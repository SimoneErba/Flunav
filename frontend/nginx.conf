server {
    listen 80;
    server_name localhost;

    # --- 1. Frontend (React) ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # This ensures React Router works (redirects 404s to index.html)
        try_files $uri $uri/ /index.html;
    }

    # --- 2. Backend API ---
    location /api {
        # 'backend' matches the service name in docker-compose
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 3. WebSockets (CRITICAL) ---
    # Spring Boot usually maps STOMP to /ws or /ws/websocket
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        
        # These headers are required for WebSocket handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # Prevent Nginx from closing the connection too early
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- 4. Swagger UI ---
    # Swagger needs these paths to load assets and docs
    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}