server {
    listen 80;
    server_name demo.flunav.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name demo.flunav.com;

    ssl_certificate /etc/letsencrypt/live/demo.flunav.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.flunav.com/privkey.pem;
    # ... altre direttive ssl ...

    # --- ROUTING PER L'API DEL BACKEND ---
    # Tutte le richieste che iniziano con /api/ vengono inviate al backend.
    location /api/ {
        proxy_pass http://backend:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- ROUTING PER I WEBSOCKETS ---
    # Le richieste al percorso dei WebSocket vengono inviate al backend.
    location /ws/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # --- ROUTING PER TUTTO IL RESTO (IL FRONTEND) ---
    # Qualsiasi altra richiesta viene inviata al servizio frontend.
    location / {
        proxy_pass http://frontend; # 'frontend' è il nome del nostro nuovo servizio
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}