services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:${FRONTEND_PORT} 
    container_name: flonav_frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    # Uses the image built locally via 'mvn jib:dockerBuild'
    image: flumen-backend:latest
    pull_policy: never
    container_name: flonav_backend
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      orientdb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=backend
      - SPRING_PROFILES_ACTIVE=docker
      
      # --- ORIENTDB CONFIG ---
      - ORIENTDB_URL=remote:orientdb/main
      - ORIENTDB_USERNAME=root
      - ORIENTDB_PASSWORD=${ORIENTDB_ROOT_PASSWORD}
      
      # --- REDIS CONFIG ---
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      
      # --- RABBITMQ CONFIG ---
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      
      # --- CLICKHOUSE CONFIG ---
      # Note: Internal port is 8123
      - CLICKHOUSE_URL=http://clickhouse:8123/${CLICKHOUSE_DB}
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    networks:
      - app-network

  orientdb:
    image: orientdb:3.2.2
    container_name: flonav_orientdb
    environment:
      ORIENTDB_ROOT_PASSWORD: ${ORIENTDB_ROOT_PASSWORD}
      ORIENTDB_OPTS_MEMORY: "-Xms512m -Xmx512m"
      ORIENTDB_NETWORK_HOST: "0.0.0.0"
    ports:
      - "${ORIENTDB_BINARY_PORT}:2424"
      - "${ORIENTDB_HTTP_PORT}:2480"
    volumes:
      - ./docker/orientdb/entrypoint.sh:/orientdb/entrypoint.sh
      - orientdb-data:/orientdb/databases
      - orientdb-config:/orientdb/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2480"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: ["/orientdb/entrypoint.sh"]
    restart: always
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: flonav_clickhouse
    restart: always
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./docker/clickhouse/init-clickhouse:/docker-entrypoint-initdb.d/
    environment:
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: 1
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: flonav_rabbitmq
    restart: always
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: always
    container_name: flonav_redis
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    container_name: flonav_redis_ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${REDIS_UI_PORT}:8081"
    depends_on:
      - redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  orientdb-data:
  orientdb-config:
  clickhouse-data:
  rabbitmq_data:
  redis_data: