name: Publish Release Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  # ====================================================
  # JOB 1: BACKEND (Java/Spring Boot via Jib)
  # ====================================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # FIX: Convert repository name to lowercase
      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Install 'commons' so the backend can find it
      - name: Install Commons to local Maven repo
        run: mvn clean install -DskipTests -f commons/pom.xml

      # 2. Build and Push Backend using Jib
      - name: Build and Push Backend Image
        run: |
          cd backend
          mvn compile jib:build \
            -Dimage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }} \
            -Djib.to.tags=latest \
            -Djib.container.format=Docker \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -DskipTests

  # ====================================================
  # JOB 2: SIMULATOR (Java via Jib)
  # ====================================================
  build-simulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Install 'commons' (Simulator depends on it too)
      - name: Install Commons to local Maven repo
        run: mvn clean install -DskipTests -f commons/pom.xml

      # 2. Build and Push Simulator
      - name: Build and Push Simulator Image
        run: |
          cd simulator
          mvn compile jib:build \
            -Dimage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-simulator:${{ github.ref_name }} \
            -Djib.to.tags=latest \
            -Djib.container.format=Docker \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -DskipTests

  # ====================================================
  # JOB 2: FRONTEND (React/Nginx via Docker)
  # ====================================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FIX: Convert repository name to lowercase
      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags based on the git tag (v1.0.0) and adds 'latest'
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Use the lowercased env variable here
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/
            VITE_DEMO_MODE=true
            VITE_PUBLIC_POSTHOG_KEY=phc_Cke8VNUGFWiYGJePxTwI4GcwUZqDN03mDI2mqDgZjtC
