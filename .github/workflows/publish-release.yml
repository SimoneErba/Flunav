name: Publish Release Images

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2.3.4, etc.

env:
  REGISTRY: ghcr.io
  # Uses the repository name (e.g., youruser/flumen)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ====================================================
  # JOB 1: BACKEND (Java/Spring Boot via Jib)
  # ====================================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Install 'commons' so the backend can find it
      - name: Install Commons to local Maven repo
        run: mvn clean install -DskipTests -f commons/pom.xml

      # 2. Build and Push Backend using Jib
      # We push two tags: the specific version (e.g., v1.0.0) and 'latest'
      - name: Build and Push Backend Image
        run: |
          cd backend
          mvn compile jib:build \
            -Dimage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -DskipTests

  # ====================================================
  # JOB 2: FRONTEND (React/Nginx via Docker)
  # ====================================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags based on the git tag (v1.0.0) and adds 'latest'
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CRITICAL: Bake the relative path for Nginx proxying
          build-args: |
            VITE_API_BASE_URL=/