services:
  orientdb:
    image: orientdb:3.2.50
    container_name: flunav_dev_orientdb
    mem_limit: ${ORIENTDB_MEMORY_LIMIT:-2g}
    environment:
      ORIENTDB_ROOT_PASSWORD: Flun4v!
      ORIENTDB_OPTS_MEMORY: ${ORIENTDB_HEAP_OPTS:--Xms1g -Xmx1g}
      ORIENTDB_NETWORK_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:2424:2424"
      - "127.0.0.1:2480:2480"
    volumes:
      - ./docker/orientdb/init:/docker-entrypoint-initdb.d
      - orientdb-dev-data:/orientdb/databases
      - orientdb-dev-config:/orientdb/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2480"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.3.21
    container_name: flunav_dev_clickhouse
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT:-4g}
    restart: always
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-dev-data:/var/lib/clickhouse
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./docker/clickhouse/init-clickhouse:/docker-entrypoint-initdb.d/
    environment:
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: 1
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: Flun4v!
      CLICKHOUSE_DB: default
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT throwIf(count() != 5, 'analytics_time_series schema mismatch')
          FROM system.columns WHERE database = '$$CLICKHOUSE_DB'
          AND table = 'analytics_time_series'
          AND name IN ('bucket_start', 'bucket_seconds', 'items_entered', 'items_exited', 'items_current')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: flunav_dev_rabbitmq
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-1g}
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: Flun4v!
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - rabbitmq-dev-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: always
    container_name: flunav_dev_redis
    mem_limit: ${REDIS_MEMORY_LIMIT:-2g}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-1gb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-dev-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    container_name: flunav_dev_redis_ui
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    networks:
      - app-network

  vector:
    image: timberio/vector:0.51.1-alpine
    container_name: flunav_dev_vector
    restart: always
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: Flun4v!
    volumes:
      - ./docker/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./logs:/var/log/flumen-host:ro
      - ./backend/logs:/var/log/flumen-backend-host:ro
      - vector-dev-data:/var/lib/vector
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - app-network

  assistant-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trigger
      POSTGRES_USER: trigger
      POSTGRES_PASSWORD: ${ASSISTANT_POSTGRES_PASSWORD:-Flun4v!}
    volumes:
      - assistant-postgres-dev-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trigger -d trigger"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - assistant-network

  assistant-electric:
    image: electricsql/electric:1.2.4
    environment:
      DATABASE_URL: postgresql://trigger:${ASSISTANT_POSTGRES_PASSWORD:-Flun4v!}@assistant-postgres:5432/trigger?sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"
    depends_on:
      assistant-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - assistant-network

  assistant-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - assistant-redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - assistant-network

  assistant-clickhouse:
    image: clickhouse/clickhouse-server:25.12.3.21
    environment:
      CLICKHOUSE_DB: trigger
      CLICKHOUSE_USER: trigger
      CLICKHOUSE_PASSWORD: ${ASSISTANT_CLICKHOUSE_PASSWORD:-Flun4v!}
    volumes:
      - assistant-clickhouse-dev-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user trigger --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - assistant-network

  assistant-s2-init:
    image: busybox:1.37
    environment:
      REALTIME_STREAMS_S2_BASIN: ${ASSISTANT_S2_BASIN:-flumen-trigger-realtime}
    command:
      - sh
      - -c
      - |
        cat > /config/s2-spec.json <<JSON
        {
          "basins": [
            {
              "name": "$$REALTIME_STREAMS_S2_BASIN",
              "config": { "create_stream_on_append": true, "create_stream_on_read": true }
            }
          ]
        }
        JSON
    volumes:
      - assistant-s2-dev-config:/config
    networks:
      - assistant-network

  assistant-s2:
    image: ghcr.io/s2-streamstore/s2:latest@sha256:d6ded5ca7dd619fa7c946f06e39a98f9c95c6883c8bb884e5eaa129f232c920c
    user: "0:0"
    command: ["lite", "--init-file", "/config/s2-spec.json", "--local-root", "/data"]
    depends_on:
      assistant-s2-init:
        condition: service_completed_successfully
    volumes:
      - assistant-s2-dev-config:/config
      - assistant-s2-dev-data:/data
    networks:
      - assistant-network

  assistant-object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ASSISTANT_MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${ASSISTANT_MINIO_PASSWORD:-Flun4v!Minio}
    volumes:
      - assistant-object-storage-dev-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - assistant-network

  assistant-object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_USER: ${ASSISTANT_MINIO_USER:-admin}
      MINIO_PASSWORD: ${ASSISTANT_MINIO_PASSWORD:-Flun4v!Minio}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://assistant-object-storage:9000 "$$MINIO_USER" "$$MINIO_PASSWORD";
        do sleep 1; done;
        mc mb --ignore-existing local/packets
    depends_on:
      assistant-object-storage:
        condition: service_healthy
    networks:
      - assistant-network

  assistant-registry:
    image: registry:2.8.3
    volumes:
      - assistant-registry-dev-data:/var/lib/registry
    networks:
      - assistant-network

  assistant-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - assistant-network

  assistant-trigger-webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:v4.5.7
    restart: always
    environment:
      APP_ORIGIN: ${ASSISTANT_TRIGGER_PUBLIC_URL:-http://localhost:8030}
      LOGIN_ORIGIN: ${ASSISTANT_TRIGGER_PUBLIC_URL:-http://localhost:8030}
      API_ORIGIN: http://assistant-trigger-webapp:3000
      DEV_ENGINE_URL: http://assistant-trigger-webapp:3000
      DATABASE_URL: postgresql://trigger:${ASSISTANT_POSTGRES_PASSWORD:-Flun4v!}@assistant-postgres:5432/trigger?schema=public&sslmode=disable
      DIRECT_URL: postgresql://trigger:${ASSISTANT_POSTGRES_PASSWORD:-Flun4v!}@assistant-postgres:5432/trigger?schema=public&sslmode=disable
      ELECTRIC_ORIGIN: http://assistant-electric:3000
      REDIS_HOST: assistant-redis
      REDIS_PORT: 6379
      REDIS_TLS_DISABLED: "true"
      CLICKHOUSE_URL: http://trigger:${ASSISTANT_CLICKHOUSE_PASSWORD:-Flun4v!}@assistant-clickhouse:8123?secure=false
      RUN_REPLICATION_ENABLED: 1
      RUN_REPLICATION_CLICKHOUSE_URL: http://trigger:${ASSISTANT_CLICKHOUSE_PASSWORD:-Flun4v!}@assistant-clickhouse:8123
      OBJECT_STORE_BASE_URL: http://assistant-object-storage:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${ASSISTANT_MINIO_USER:-admin}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${ASSISTANT_MINIO_PASSWORD:-Flun4v!Minio}
      REALTIME_STREAMS_DEFAULT_VERSION: v2
      REALTIME_STREAMS_S2_BASIN: ${ASSISTANT_S2_BASIN:-flumen-trigger-realtime}
      REALTIME_STREAMS_S2_ACCESS_TOKEN: "ignored"
      REALTIME_STREAMS_S2_ENDPOINT: http://assistant-s2/v1
      REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS: "true"
      SESSION_SECRET: ${ASSISTANT_SESSION_SECRET:-flumen-session-secret-0000000000}
      MAGIC_LINK_SECRET: ${ASSISTANT_MAGIC_LINK_SECRET:-flumen-magiclink-secret-00000000}
      ENCRYPTION_KEY: ${ASSISTANT_ENCRYPTION_KEY:-flumen-encryption-key-0000000000}
      PROVIDER_SECRET: ${ASSISTANT_PROVIDER_SECRET:-flumen-provider-secret-000000000}
      COORDINATOR_SECRET: ${ASSISTANT_COORDINATOR_SECRET:-flumen-coordinator-secret-000000}
      MANAGED_WORKER_SECRET: ${ASSISTANT_MANAGED_WORKER_SECRET:-flumen-worker-secret-00000000000}
      DEPLOY_REGISTRY_HOST: assistant-registry:5000
      DEPLOY_REGISTRY_NAMESPACE: flumen-trigger
      TRIGGER_BOOTSTRAP_ENABLED: 1
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: flumen-bootstrap
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token
      TRIGGER_TELEMETRY_DISABLED: 1
    user: root
    command: ["sh", "-c", "chown -R node:node /home/node/shared && exec ./scripts/entrypoint.sh"]
    volumes:
      - assistant-trigger-dev-shared:/home/node/shared
    ports:
      - "127.0.0.1:${ASSISTANT_TRIGGER_PORT:-8030}:3000"
    depends_on:
      assistant-postgres:
        condition: service_healthy
      assistant-redis:
        condition: service_healthy
      assistant-clickhouse:
        condition: service_healthy
      assistant-electric:
        condition: service_healthy
      assistant-s2:
        condition: service_started
      assistant-object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:3000/healthcheck', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - assistant-network

  assistant-gateway:
    build:
      context: ./assistant
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 8090
      FLUMEN_BACKEND_URL: http://host.docker.internal:8080
      FLUMEN_SERVICE_TOKEN: ${FLUMEN_SERVICE_TOKEN:-${FLUMEN_ASSISTANT_SERVICE_TOKEN:-}}
      TRIGGER_API_URL: http://assistant-trigger-webapp:3000
      TRIGGER_PUBLIC_URL: ${ASSISTANT_TRIGGER_PUBLIC_URL:-http://localhost:8030}
      TRIGGER_SECRET_KEY: ${ASSISTANT_TRIGGER_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${ASSISTANT_GATEWAY_PORT:-8090}:8090"
    depends_on:
      assistant-trigger-webapp:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - assistant-network
      - app-network

  assistant-trigger-supervisor:
    image: ghcr.io/triggerdotdev/supervisor:v4.5.7
    restart: always
    environment:
      TRIGGER_API_URL: http://assistant-trigger-webapp:3000
      TRIGGER_WORKER_TOKEN: file:///home/node/shared/worker_token
      MANAGED_WORKER_SECRET: ${ASSISTANT_MANAGED_WORKER_SECRET:-flumen-worker-secret-00000000000}
      DOCKER_HOST: tcp://assistant-socket-proxy:2375
      TRIGGER_WORKLOAD_API_DOMAIN: assistant-trigger-supervisor
      TRIGGER_WORKLOAD_API_PORT_EXTERNAL: 8020
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      DOCKER_RUNNER_NETWORKS: flumen-dev-assistant,flumen-dev-app
      DOCKER_REGISTRY_URL: assistant-registry:5000
      DOCKER_AUTOREMOVE_EXITED_CONTAINERS: 1
      FLUMEN_BACKEND_URL: http://host.docker.internal:8080
      FLUMEN_SERVICE_TOKEN: ${FLUMEN_SERVICE_TOKEN:-${FLUMEN_ASSISTANT_SERVICE_TOKEN:-}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_SMALL_MODEL: ${GROQ_SMALL_MODEL:-openai/gpt-oss-20b}
      GROQ_LARGE_MODEL: ${GROQ_LARGE_MODEL:-openai/gpt-oss-120b}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
    user: root
    command: ["sh", "-c", "chown -R node:node /home/node/shared && exec /usr/bin/dumb-init -- pnpm run --filter supervisor start"]
    volumes:
      - assistant-trigger-dev-shared:/home/node/shared
    depends_on:
      assistant-trigger-webapp:
        condition: service_healthy
      assistant-socket-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:8020/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - assistant-network
      - app-network

  trigger-dev:
    image: node:22-alpine
    restart: always
    working_dir: /workspace
    volumes:
      - ./assistant:/workspace
    environment:
      TRIGGER_API_URL: http://assistant-trigger-webapp:3000
      TRIGGER_ACCESS_TOKEN: ${ASSISTANT_TRIGGER_ACCESS_TOKEN:-}
      TRIGGER_PROJECT_REF: ${ASSISTANT_TRIGGER_PROJECT_REF:-flumen-assistant}
      FLUMEN_BACKEND_URL: http://host.docker.internal:8080
      FLUMEN_SERVICE_TOKEN: ${FLUMEN_SERVICE_TOKEN:-${FLUMEN_ASSISTANT_SERVICE_TOKEN:-}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_SMALL_MODEL: ${GROQ_SMALL_MODEL:-openai/gpt-oss-20b}
      GROQ_LARGE_MODEL: ${GROQ_LARGE_MODEL:-openai/gpt-oss-120b}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
    command: ["sh", "-c", "npm ci && npm run dev"]
    depends_on:
      assistant-trigger-webapp:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - assistant-network
      - app-network

networks:
  app-network:
    name: flumen-dev-app
    driver: bridge
  assistant-network:
    name: flumen-dev-assistant
    driver: bridge

volumes:
  orientdb-dev-data:
  orientdb-dev-config:
  clickhouse-dev-data:
  rabbitmq-dev-data:
  redis-dev-data:
  vector-dev-data:
  assistant-postgres-dev-data:
  assistant-redis-dev-data:
  assistant-clickhouse-dev-data:
  assistant-object-storage-dev-data:
  assistant-registry-dev-data:
  assistant-s2-dev-config:
  assistant-s2-dev-data:
  assistant-trigger-dev-shared:
